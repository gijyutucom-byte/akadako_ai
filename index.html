<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アプリエ for AkaDako</title>
<meta name="description" content="アプリエ for AkaDakoは、タコラッチ・タコラッチ・ミニ用Webアプリの構想・作成・修正・理解を支援する学習・開発ツールです。">
<meta name="theme-color" content="#f7eee7">
<link rel="icon" type="image/png" href="akadako.png">
<link rel="apple-touch-icon" href="akadako.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="appie-for-akadako.css">
</head>
<body>
<main id="home" class="home">
  <section class="hero">
    <div class="hero-row">
      <img class="app-logo" src="akadako.png" width="168" height="168" alt="AkaDakoのアイコン">
      <div class="hero-copy">
        <p class="hero-kicker">タコラッチ／タコラッチ・ミニ用 Webアプリ作成支援</p>
        <h1 class="hero-title">アプリエ for AkaDako</h1>
        <p class="lead"><span>AIとの対話を通して、AkaDakoシリーズ用の「こんなアプリを作りたい」というアイデアを形にする学習・開発支援ツールです。</span><span>機種に応じた仕様づくりから作成、トラブル解決、仕組みの理解までを順番にサポートします。</span></p>
      </div>
    </div>
  </section>

  <section class="choice-grid" aria-label="機能選択">
    <button class="choice-card" type="button" onclick="openTool('spec')">
      <div class="icon">📝</div><div class="choice-body">
        <h2>①アプリを作る</h2>
        <p>目的・機能・条件・参考資料を整理してAkaDako用の仕様書を生成し、ChatGPT等でアプリを作成します。</p>
      </div>
    </button>

    <button class="choice-card" type="button" onclick="openTool('trouble')">
      <div class="icon">🛠️</div><div class="choice-body">
        <h2>②アプリを動かす</h2>
        <p>うまく動かないAkaDakoアプリの状況を整理し、AIへ再依頼する文章を作成します。</p>
      </div>
    </button>

    <button class="choice-card" type="button" onclick="openTool('understand')">
      <div class="icon">🧭</div><div class="choice-body">
        <h2>③アプリを理解する</h2>
        <p>仕様と生成されたプログラムから、要件定義書とアクティビティ図を一度に作成します。</p>
      </div>
    </button>

  </section>
  <p class="footer-note">AIが生成した内容やコードは、使う前に必ず内容・動作・個人情報の扱いを確認してください。</p>
  <div class="bottom-actions"><a class="contact-btn" href="https://mura-lab.info/main/contact" target="_blank" rel="noopener noreferrer">開発者に問い合わせ</a><div class="top-copyright">(c)2026 <a href="https://gijyutu.com/main/" target="_blank" rel="noopener noreferrer">Muramatsu</a></div></div>
</main>

<section id="toolShell" class="tool-shell" aria-label="選択した機能">
  <iframe id="toolFrame" title="アプリエ 機能画面"></iframe>
</section>

<script src="appie-for-akadako.js"></script></body>
</html>
